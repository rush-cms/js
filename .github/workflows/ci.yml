name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - run: bun install --frozen-lockfile
            - run: bun run ci
